<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="focus_warning">집중 모드 경고</title>
    <link rel="stylesheet" href="newtab.css"/> 
    <style>
        body {
            background-color: #111111;
            color: #eeeeee;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .blocker-content {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            border: 2px solid var(--focus-color);
            color: var(--text-primary);
        }

        .blocker-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-proceed, .btn-cancel {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-proceed {
            background-color: var(--focus-color);
            color: white;
        }

        .btn-cancel {
            background-color: #e4e4e7;
            color: var(--text-primary);
        }

        .small-text {
            font-size: 0.8em;
            color: var(--text-secondary);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="blocker-content">
        <h2 data-i18n="focus_warning">🚨 집중 모드 경고: 방해 웹사이트 접근 시도</h2>
        <p data-i18n="focus_warning_desc">현재 집중 모드가 활성화되어 있습니다.</p>
        <p><strong id="blocked-url-display"></strong></p>
        <p data-i18n="focus_warning_ask">목표 달성을 위해 허용 목록에 없는 웹사이트에 접근하시겠습니까?</p>
        <div class="blocker-actions">
            <button id="confirm-yes" class="btn-proceed" data-i18n="yes_proceed">예, 접근합니다</button>
            <button id="confirm-no" class="btn-cancel" data-i18n="no_cancel">아니오, 돌아갑니다</button>
        </div>
        <p class="small-text" data-i18n="careful_message">신중하게 선택하세요. 목표가 눈앞에 있습니다!</p>
    </div>

    <script src="warning.js"></script>

</body>
</html>

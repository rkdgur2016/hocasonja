<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>집중 모드 경고</title>
    <link rel="stylesheet" href="newtab.css"/> 
    <style>
        /* 경고 페이지의 배경을 채우기 위한 스타일 */
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #0c1c4b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* 스크롤 방지 */
        }
        
        /* newtab.css의 .blocker-content를 중앙에 직접 배치 */
        .blocker-content {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid #EF4444;
            animation: fadeIn 0.3s ease-out;
            color: white; /* 텍스트 색상 보장 */
        }
        /* 추가적인 중앙 배치 스타일 */
        .page-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <div class="blocker-content page-center">
        <h2>🚨 집중 모드 경고: 방해 웹사이트 접근 시도</h2>
        <p>현재 <span class="highlight-text">집중 모드</span>가 활성화되어 있습니다.</p>
        <p>목표 달성을 위해 허용 목록에 없는 웹사이트(<strong id="blocked-url-display"></strong>)에 접근하시겠습니까?</p>
        <div class="blocker-actions">
            <button id="confirm-yes" class="btn-proceed">예, 접근합니다</button>
            <button id="confirm-no" class="btn-cancel">아니오, 돌아갑니다</button>
        </div>
        <p class="small-text">신중하게 선택하세요. 목표가 눈앞에 있습니다!</p>
    </div>

    <script src="warning.js"></script>

</body>
</html>

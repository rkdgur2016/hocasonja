<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 집중 모드 활성화: 잠시 멈춤</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" xintegrity="sha512-SnH5WK+bZxgPHs44uWIX+LLMDJ/cnS/6p9VnE/T6U5Gq6Q3ZpG8Qk5K2c8K5yE5A5v6Zg8C5k4R5yV4g2F5p5Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="redirectTab.css"/>
</head>
<body>

    <div class="card">
        <div class="text-6xl mb-4" role="img" aria-label="경고 및 집중 아이콘">
            🛑
        </div>
        <h1 class="text-3xl sm:text-4xl font-extrabold text-red-400 mb-6 tracking-tight" style="font-size: 2.25rem; font-weight: 800; color: #f87171;">
            집중 모드! 접근이 허용되지 않은 URL입니다.
        </h1>
        
        <p class="text-lg text-gray-300 mb-4" style="font-size: 1.125rem; color: #d1d5db;">
            잠깐 멈추고, 지금 당신에게 가장 중요한 목표를 다시 한번 확인하세요.
        </p>

        <!-- Goal Motto Display Area -->
        <div class="motto-box">
            <h2 class="text-xl font-semibold text-gray-300 mb-2" style="font-size: 1.25rem; font-weight: 600; color: #d1d5db;">
                ✨ 나의 현재 목표 문구
            </h2>
            <p id="goal-motto-text" style="font-size: 1.875rem; font-weight: 900; color: white; font-style: italic;">
                로딩 중...
            </p>
        </div>
        
        <div class="flex flex-col sm:flex-row gap-4 justify-center mt-8">
            <button id="access-btn" class="btn-gray">
                접근할까요? (경고 무시)
            </button>
            <button id="back-btn" class="btn-red">
                돌아갈까요? (집중 유지)
            </button>
        </div>
        
        <p class="text-sm text-gray-400 mt-6" style="font-size: 0.875rem; color: #9ca3af;">
            '돌아가기'를 누르면 안전한 생산성 대시보드로 복귀합니다.
        </p>
    </div>
    <script src="redirectTab.js"></script>
</body>
</html>
